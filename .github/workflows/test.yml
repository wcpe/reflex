name: 测试

# 触发：master 分支的任意提交与针对 master 的拉取请求。
# 普通提交只跑测试、不发布；发布由推送「版本号 tag」触发的 publish.yml 负责。
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # reflex 的 sourceCompatibility=1.8，用 JDK 8 编译确保产物兼容 Java 8
          java-version: '8'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 运行测试
        run: ./gradlew test --no-daemon --console=plain --stacktrace
