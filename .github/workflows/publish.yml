name: 发布到 maven.wcpe.top

# 触发：推送「版本号 tag」时发布。tag 必须与 gradle.properties 的 version 完全一致
# （例如 gradle.properties 中 version=1.2.5-wcpe.1 时，打同名 tag 1.2.5-wcpe.1 并推送），
# 校验不通过会直接失败，避免误发版；普通提交推送到 master 只跑测试，不再自动发布。
on:
  push:
    tags:
      - '*'

# 同一 tag 的发布串行排队，避免并发互相覆盖
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 校验版本号与 tag 一致
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${REF#refs/tags/}"
          base="$(grep -E '^version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          if [ "${tag}" != "${base}" ]; then
            echo "::error::发布失败：tag 为 ${tag}，gradle.properties 版本为 ${base}，两者不一致。请先更新 gradle.properties 再打同名 tag。"
            exit 1
          fi
          echo "版本校验通过：${tag}"

      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # reflex 的 sourceCompatibility=1.8，用 JDK 8 编译确保产物兼容 Java 8
          java-version: '8'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 运行测试（发布门禁）
        run: ./gradlew test --no-daemon --console=plain --stacktrace

      - name: 发布全部模块
        env:
          # Gradle 会把 ORG_GRADLE_PROJECT_xxx 环境变量映射为工程属性 xxx，
          # 对应 build.gradle.kts 里的 findProperty("tabooprojectUsername" / "tabooprojectPassword")
          ORG_GRADLE_PROJECT_tabooprojectUsername: ${{ secrets.TABOOPROJECTUSERNAME }}
          ORG_GRADLE_PROJECT_tabooprojectPassword: ${{ secrets.TABOOPROJECTPASSWORD }}
        run: ./gradlew publish --no-daemon --console=plain --stacktrace

  # Maven 发布成功后，再发布 GitHub Release：
  # tag 即版本号（与 maven 发布坐标一致），正文按提交类型（Conventional Commits）
  # 归纳上一发布至当前的中文变更日志。同一 tag 重跑时幂等：仅更新正文。
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # 仅本 job 需要写权限以创建 Release 与版本 tag，其余 job 保持只读，遵循最小权限
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 归纳变更日志需要完整历史与 tag，才能对比上一发布
          fetch-depth: 0
          fetch-tags: true

      - name: 生成版本号与变更日志
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # tag 即版本号（如 1.2.5-wcpe.1），与 maven 发布坐标保持一致
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # 上一发布：取仓库当前「最新 Release」的 tag 作为变更日志起点；
          # 不存在或等于当前 tag（同一版本重跑）时退化为只记录当前提交
          prev_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -n "${prev_tag}" ] && [ "${prev_tag}" != "${tag}" ] && git rev-parse -q --verify "refs/tags/${prev_tag}^{commit}" >/dev/null; then
            log_args=("${prev_tag}..HEAD")
            first_release=false
          else
            prev_tag=""
            log_args=(-n 1 HEAD)
            first_release=true
          fi

          notes="$(mktemp)"
          {
            echo "## ${tag}"
            echo
            if [ "${first_release}" = "true" ]; then
              echo "首次发布（仅记录当前提交，后续版本将自动对比上一发布）。"
            else
              echo "对比上一发布 \`${prev_tag}\` 的变更："
            fi
            echo
          } > "${notes}"

          # 提交类型 -> 中文分节标题；按下列顺序输出
          order=(feat fix perf refactor docs style test build ci chore revert other)
          declare -A title=(
            [feat]="✨ 新功能" [fix]="🐛 修复" [perf]="⚡ 性能优化" [refactor]="♻️ 重构"
            [docs]="📝 文档" [style]="💄 代码风格" [test]="✅ 测试" [build]="📦 构建"
            [ci]="👷 持续集成" [chore]="🔧 杂项" [revert]="⏪ 回滚" [other]="📌 其他"
          )
          declare -A bucket

          # 用制表符(0x09)分隔短哈希与标题；提交标题一般不含制表符
          # 使用 tformat 而非 format，确保每条记录都以换行结尾，while read 不会漏掉最后一条
          re='^([a-zA-Z]+)(\([^)]*\))?!?:'
          while IFS=$'\t' read -r h s; do
            [ -n "${h}" ] || continue
            if [[ "${s}" =~ $re ]]; then
              t="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
            else
              t="other"
            fi
            [ -n "${title[${t}]:-}" ] || t="other"
            bucket[${t}]+="- ${s} (\`${h}\`)"$'\n'
          done < <(git log --no-merges --pretty=tformat:'%h%x09%s' "${log_args[@]}")

          for t in "${order[@]}"; do
            if [ -n "${bucket[${t}]:-}" ]; then
              {
                echo "### ${title[${t}]}"
                echo
                printf '%s\n' "${bucket[${t}]}"
              } >> "${notes}"
            fi
          done

          if [ "${first_release}" != "true" ]; then
            echo "**完整变更**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}" >> "${notes}"
          fi

          echo "notes_file=${notes}" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并标记为最新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.notes.outputs.tag }}"
          notes_file="${{ steps.notes.outputs.notes_file }}"
          # 同一 tag 重跑时幂等：已存在则仅更新正文，否则在当前提交新建 tag 并发布
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --notes-file "${notes_file}" --latest
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --notes-file "${notes_file}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi
